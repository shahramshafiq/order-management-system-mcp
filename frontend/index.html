<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Order Management Assistant</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>Order Management Assistant</h1>
      <p>Testing UI for the MCP inventory/order assistant</p>
    </header>

    <div id="messages" class="messages">
      <div class="message assistant">
        <div class="bubble">
          Hi, ask me about inventory or orders.
          For example: "add 20 wireless mice at 2500 each"
          OR
          "what's low on stock?"
        </div>
      </div>
    </div>

    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
